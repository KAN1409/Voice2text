name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/voice2text-permanent.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/voice2text-permanent.jks" >> "$GITHUB_ENV"
            echo "Using permanent signing key from repository secrets."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Permanent signing secret is not configured; debug build will use an ephemeral key."
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.TranscriptionEngineUnitTest" --tests "com.example.CaptureTitleSuggesterTest" --tests "com.example.ExampleUnitTest"

      - name: Build APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/Voice2text.apk
          else
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/Voice2text.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Voice2text-apk
          path: app/build/outputs/apk/Voice2text.apk
